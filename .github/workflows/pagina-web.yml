# Publica la app (carpeta app/) en GitHub Pages cada vez que cambia en main.
# En internet la app arranca en modo demostración (simulador), porque la
# cortina real solo se puede controlar desde su propia red.
name: Publicar la app en la web

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/pagina-web.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: despliegue
        uses: actions/deploy-pages@v4
