; Cortina inteligente con ESP32
; Sensor: LDR (divisor de tensión)  |  Actuador: motor paso a paso 28BYJ-48 + ULN2003
; Filtro: Kalman de 2 estados  |  App web servida por el propio ESP32
;
; La app (app/index.html) se comprime y se incrusta en el firmware de forma
; automática en cada compilación (scripts/incrustar_app.py). Basta con "Upload".

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder

build_flags =
    -DCORE_DEBUG_LEVEL=0

extra_scripts =
    pre:scripts/incrustar_app.py

lib_deps =
    bblanchon/ArduinoJson@7.2.1
